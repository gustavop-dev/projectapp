[run]
# Los shards del CI miden en runners distintos y sus datos se juntan con
# `coverage combine`; sin rutas relativas cada uno aporta paths absolutos de su
# propia maquina y el combinado cuenta el mismo archivo N veces.
relative_files = True
# `parallel` queda deliberadamente APAGADO: haria que pytest escriba
# `.coverage.<host>.<pid>` tambien en local, y el reporte de terminal de
# backend/conftest.py lee `.coverage` a secas y quedaria vacio. El nombre unico
# por shard lo pone scripts/ci/backend-merge-shards.py al recogerlos.
omit =
    */migrations/*
    */tests/*
    */management/commands/*
