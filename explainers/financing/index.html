<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Financiación — resumen en un minuto</title>
    <link rel="stylesheet" href="assets/brand.css" />
    <link rel="stylesheet" href="assets/layout.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="72"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <section id="scene-intro" class="clip scene scene--dark" data-start="0" data-duration="6" data-track-index="1"></section>
      <section id="scene-what" class="clip scene scene--light" data-start="6" data-duration="8" data-track-index="2"></section>
      <section id="scene-conditions" class="clip scene scene--light" data-start="14" data-duration="22" data-track-index="3"></section>
      <section id="scene-options" class="clip scene scene--light" data-start="36" data-duration="18" data-track-index="4"></section>
      <section id="scene-apply" class="clip scene scene--light" data-start="54" data-duration="10" data-track-index="5"></section>
      <section id="scene-close" class="clip scene scene--dark" data-start="64" data-duration="8" data-track-index="6"></section>
    </div>

    <!-- Orden obligatorio: gsap → contenido congelado → guion → helpers → timeline (todo síncrono). -->
    <script src="assets/gsap.min.js"></script>
    <script src="content.js"></script>
    <script src="script.js"></script>
    <script src="assets/engine.js"></script>
    <script src="timeline.js"></script>
    <script>
      // timeline.js deja la timeline pausada en window.EXPLAINER_TIMELINE;
      // la registración queda acá, en el HTML, para que `hyperframes lint` la vea.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.EXPLAINER_TIMELINE;
    </script>
  </body>
</html>
